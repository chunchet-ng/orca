name: Cloudflare platform validation

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  CI: '1'

jobs:
  transports:
    name: Tunnel transport tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Bootstrap manifest-pinned pnpm
        shell: bash
        run: |
          npm pack pnpm@12.14.0 --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP" --ignore-scripts --fetch-timeout=120000 --fetch-retries=2
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { join } from 'node:path'
          const pin = JSON.parse(readFileSync('package.json', 'utf8')).packageManager
          assert.match(pin, /^pnpm@12\.14\.0\+sha512\.[a-f0-9]{128}$/)
          const archive = join(process.env.RUNNER_TEMP, 'pnpm-12.14.0.tgz')
          assert.equal(createHash('sha512').update(readFileSync(archive)).digest('hex'), pin.split('+sha512.')[1])
          const prefix = join(process.env.RUNNER_TEMP, 'orca-pnpm')
          appendFileSync(process.env.GITHUB_PATH, (process.platform === 'win32' ? prefix : join(prefix, 'bin')) + '\n')
          JS
          npm install --global --prefix "$RUNNER_TEMP/orca-pnpm" "$RUNNER_TEMP/pnpm-12.14.0.tgz" --no-audit --no-fund --fetch-timeout=120000 --fetch-retries=2
      - name: Verify pnpm version
        shell: bash
        run: test "$(pnpm --version)" = 12.14.0
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build internal packages
        run: pnpm run build:packages
      - name: Build Windows permission verifier
        if: runner.os == 'Windows'
        run: pnpm exec node-gyp rebuild --directory native/windows-security
      - name: Test desktop and CLI transports
        run: pnpm exec vitest run --config config/vitest.config.ts src/shared/network/endpoint-auth-headers.test.ts src/shared/remote-runtime-edge-auth.test.ts src/cli/runtime/websocket-transport.test.ts src/cli/runtime/remote-edge-auth-file.test.ts src/cli/runtime/remote-edge-auth-file-windows.test.ts src/main/credentials/runtime-edge-auth-store.test.ts src/main/runtime/runtime-environment-edge-auth.test.ts src/main/runtime/mobile-desktop-relay/mobile-desktop-relay.test.ts src/main/ipc/runtime-environments/runtime-environment-edge-auth-status.test.ts src/main/ipc/runtime-environments/runtime-environment-mobile-relay-hosts.test.ts src/main/ipc/runtime-environments/runtime-environment-edge-auth-handlers.test.ts src/main/ipc/runtime-environments/runtime-environment-pairing-edge-auth.test.ts src/renderer/src/components/settings/runtime-add-server-dialog.test.tsx src/renderer/src/components/settings/runtime-server-edge-auth-action.test.tsx
