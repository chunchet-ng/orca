name: Cloudflare platform validation

on:
  workflow_dispatch:
    inputs:
      compile_native:
        type: boolean
        default: true
        description: Rebuild native iOS after native inputs change

permissions:
  contents: read

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  CI: '1'

permissions:
  contents: read

jobs:
  transports:
    name: Tunnel transport tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Bootstrap manifest-pinned pnpm
        shell: bash
        run: |
          npm pack pnpm@12.14.0 --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP" --ignore-scripts --fetch-timeout=120000 --fetch-retries=2
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { join } from 'node:path'
          const pin = JSON.parse(readFileSync('package.json', 'utf8')).packageManager
          assert.match(pin, /^pnpm@12\.14\.0\+sha512\.[a-f0-9]{128}$/)
          const archive = join(process.env.RUNNER_TEMP, 'pnpm-12.14.0.tgz')
          assert.equal(createHash('sha512').update(readFileSync(archive)).digest('hex'), pin.split('+sha512.')[1])
          const prefix = join(process.env.RUNNER_TEMP, 'orca-pnpm')
          appendFileSync(process.env.GITHUB_PATH, (process.platform === 'win32' ? prefix : join(prefix, 'bin')) + '\n')
          JS
          npm install --global --prefix "$RUNNER_TEMP/orca-pnpm" "$RUNNER_TEMP/pnpm-12.14.0.tgz" --no-audit --no-fund --fetch-timeout=120000 --fetch-retries=2
      - name: Verify pnpm version
        shell: bash
        run: test "$(pnpm --version)" = 12.14.0
      - name: Install root dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build internal packages
        run: pnpm run build:packages
      - name: Test desktop and CLI transports
        run: pnpm exec vitest run --config config/vitest.config.ts src/shared/network/server-share-address.test.ts src/shared/pairing.test.ts src/shared/remote-runtime-client.test.ts src/shared/remote-runtime-request-websocket.test.ts src/cli/runtime/websocket-transport.test.ts
      - name: Install mobile dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Test mobile tunnel connections and credential isolation
        working-directory: mobile
        run: pnpm exec vitest run src/transport/host-endpoint.test.ts src/transport/host-endpoint-edit.test.ts src/transport/endpoint-auth-headers.test.ts src/transport/endpoint-auth-headers-store.test.ts src/transport/rpc-client-socket-headers.test.ts src/transport/mobile-endpoint-lifecycle-host-edit.test.ts scripts/endpoint-auth-native-bridge.test.ts scripts/endpoint-auth-ios-codegen.test.ts src/host-edit-save-flow.test.ts src/host-edit-route-accessibility.test.ts src/components/edge-auth-headers-section.test.tsx

  ios-compile:
    if: inputs.compile_native
    name: Compile tunnel auth for iOS Simulator
    runs-on: macos-26
    timeout-minutes: 90
    env:
      BUNDLE_FROZEN: 'true'
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.22.1'
      - name: Bootstrap manifest-pinned pnpm
        shell: bash
        run: |
          npm pack pnpm@12.14.0 --registry=https://registry.npmjs.org --pack-destination "$RUNNER_TEMP" --ignore-scripts --fetch-timeout=120000 --fetch-retries=2
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          import { createHash } from 'node:crypto'
          import { readFileSync, appendFileSync } from 'node:fs'
          import { join } from 'node:path'
          const pin = JSON.parse(readFileSync('package.json', 'utf8')).packageManager
          assert.match(pin, /^pnpm@12\.14\.0\+sha512\.[a-f0-9]{128}$/)
          const archive = join(process.env.RUNNER_TEMP, 'pnpm-12.14.0.tgz')
          assert.equal(createHash('sha512').update(readFileSync(archive)).digest('hex'), pin.split('+sha512.')[1])
          const prefix = join(process.env.RUNNER_TEMP, 'orca-pnpm')
          appendFileSync(process.env.GITHUB_PATH, (process.platform === 'win32' ? prefix : join(prefix, 'bin')) + '\n')
          JS
          npm install --global --prefix "$RUNNER_TEMP/orca-pnpm" "$RUNNER_TEMP/pnpm-12.14.0.tgz" --no-audit --no-fund --fetch-timeout=120000 --fetch-retries=2
      - name: Verify pnpm version
        shell: bash
        run: test "$(pnpm --version)" = 12.14.0
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: mobile
      - name: Generate iOS project
        run: pnpm exec expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        working-directory: mobile/ios
        run: bundle exec pod install
      - name: Compile unsigned simulator app
        run: xcodebuild -workspace ios/Orca.xcworkspace -scheme Orca -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build -jobs 3 CODE_SIGNING_ALLOWED=NO build
